<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GymFlow – tu diario de entrenos</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="GymFlow">
<meta name="theme-color" content="#000000">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f4f7;--card:#fff;--ink:#12151c;--mut:#6b7280;--line:#e2e5ea;--acc:#1e6bff;--ai:#fff;--ok:#dff5ea;--bad:#e5484d;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d0f14;--card:#171a21;--ink:#f2f4f8;--mut:#8b93a3;--line:#272b35;--acc:#4c8dff;--ai:#0b1020;--ok:#16382c}}
:root[data-theme="dark"]{--bg:#0d0f14;--card:#171a21;--ink:#f2f4f8;--mut:#8b93a3;--line:#272b35;--acc:#4c8dff;--ai:#0b1020;--ok:#16382c}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 Barlow,system-ui,-apple-system,Segoe UI,sans-serif;padding-bottom:150px;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
main{max-width:520px;margin:0 auto;padding:12px 14px 0}
h1{font-size:30px;margin:6px 0 12px;font-weight:700}
h2{font-size:18px;margin:0;font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:12px}
.row{display:flex;gap:8px;align-items:center}.sp{justify-content:space-between}
.mut{color:var(--mut);font-size:14px}
button{font:inherit;font-weight:600;border:0;border-radius:10px;padding:11px 14px;background:var(--acc);color:var(--ai);min-height:44px}
button.g{background:transparent;color:var(--acc);padding:8px 10px;min-height:40px}
button.d{background:transparent;color:var(--bad);padding:8px 10px;min-height:40px}
button.s{background:var(--bg);color:var(--ink)}
button.w{width:100%}
input,select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;width:100%;min-height:44px}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:flex;gap:10px;padding:8px 0}
.top .ti{font-weight:700;font-size:18px}
.stats{display:flex;justify-content:space-around;margin-bottom:12px;text-align:center}
.stats b{display:block;font-size:20px}.stats span{font-size:13px;color:var(--mut)}
.hd,.set{display:grid;grid-template-columns:36px 1fr 1fr 1fr 42px;gap:6px;align-items:center}
.hd{margin-top:10px;font-size:12px;color:var(--mut);text-align:center;font-weight:600}
.set{margin:0 -6px;padding:4px 6px;border-radius:10px}.set.dn{background:var(--ok)}
.set input{text-align:center;font-size:18px;font-weight:600;padding:6px;min-height:40px;background:transparent}
.set.dn input{border-color:transparent}
.sn{background:var(--bg);color:var(--mut);padding:0;min-height:36px;border-radius:8px}
.sn.wm{color:#d98a00}.sn.am{color:#9b6bff}
.pv{background:transparent;color:var(--mut);padding:0;min-height:36px;font-weight:400;font-size:14px}
.ck{background:var(--bg);color:var(--mut);padding:0;min-height:40px}
.dn .ck{background:var(--acc);color:var(--ai)}
.big{font-size:26px;font-weight:700;line-height:1.1}
.chip{display:inline-block;background:var(--bg);border-radius:99px;padding:2px 10px;font-size:13px;margin:6px 6px 0 0;color:var(--mut)}
.grp{font-size:14px;color:var(--mut);font-weight:600;margin:14px 0 4px}
.ex{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:var(--card);color:var(--ink);border:1px solid var(--line);margin-bottom:6px;font-weight:600}
.th{width:44px;height:44px;border-radius:10px;object-fit:cover;flex:none;display:block}.ph{display:flex;align-items:center;justify-content:center;padding:5px}.ph svg{width:100%;height:100%}.ph.lg{padding:14px}.th.lg{width:100%;height:auto;aspect-ratio:16/10;border-radius:14px;font-size:56px}
.bar{height:6px;background:var(--bg);border-radius:9px;margin:5px 0;overflow:hidden}.bar i{display:block;height:100%;border-radius:9px}
.fl{display:flex;flex-wrap:wrap;gap:6px;padding:10px 0}.fc{flex:none;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:99px;padding:6px 14px;min-height:36px;font-size:14px}.fc.on{background:var(--acc);color:var(--ai);border-color:var(--acc)}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
#pk{display:none;position:fixed;inset:0;z-index:40;background:var(--bg);overflow:auto;padding-top:env(safe-area-inset-top,0px)}
#pk .bar{display:flex;justify-content:space-between;align-items:center;padding:10px 16px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:25}
nav button{position:relative;flex:1;background:transparent;color:var(--mut);border-radius:0;min-height:56px;font-size:12.5px;padding:6px 2px;white-space:nowrap}
nav button[aria-current="true"]{color:var(--acc);box-shadow:inset 0 3px 0 var(--acc)}
#rb{display:none;position:fixed;left:12px;right:12px;bottom:calc(66px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);border-radius:14px;padding:6px 8px 6px 14px;align-items:center;gap:4px;z-index:26;max-width:496px;margin:0 auto}
#rb span{flex:1;font-weight:600}#rb button{min-height:38px}#rb button.g{color:var(--bg)}
nav button.dot::after{content:"";position:absolute;top:8px;right:4px;width:9px;height:9px;border-radius:50%;background:#e5484d}
#splash{position:fixed;inset:0;z-index:100;background:#000;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:env(safe-area-inset-top,0px) 24px env(safe-area-inset-bottom,0px);text-align:center;transition:opacity .35s}
.sp-t{font-size:44px;font-weight:700;letter-spacing:.02em;margin-top:10px}
.sp-q{font-size:19px;max-width:300px;margin-top:14px;min-height:56px;line-height:1.3}
.sp-img{width:min(74vw,320px);height:auto;display:block;border-radius:22%}
.sp-bar{width:140px;height:4px;background:rgba(255,255,255,.22);border-radius:4px;overflow:hidden;margin-top:26px}
.sp-bar i{display:block;height:100%;background:#18a0ff;animation:ld 2s linear forwards}
.sp-h{position:absolute;bottom:calc(24px + env(safe-area-inset-bottom,0px));font-size:13px;opacity:.7}
@keyframes ld{from{width:0}to{width:100%}}
@media(prefers-reduced-motion:reduce){#splash{transition:none}.sp-bar i{animation:none;width:100%}}
#toast{position:fixed;left:50%;top:calc(16px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:99px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s;z-index:50;max-width:90vw;text-align:center}
#toast.on{opacity:1}
svg.ch{width:100%;height:auto;display:block}
.md{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:60;display:flex;align-items:center;justify-content:center;padding:20px}.mb{background:var(--card);border-radius:16px;padding:18px;width:100%;max-width:340px}.mb p{margin:0 0 14px;font-weight:600;font-size:17px}.dg{background:var(--bad);color:#fff}
@media(prefers-reduced-motion:reduce){#toast{transition:none}}
</style>
</head>

 const pts=S.logs.map(l=>{const e=l.entries.find(x=>x.name===exSel);if(!e)return null;const w=e.sets.filter(s=>!s.w);return w.length?{date:l.date,sets:w,max:Math.max(...w.map(s=>s.kg))}:null}).filter(Boolean);
 const cd=mus(exSel)==='Cardio',rm=Math.round(Math.max(0,...pts.flatMap(p=>p.sets.map(s=>s.kg*(1+s.reps/30)))));
 let h=`<div class="row"><button class="g" onclick="exSel='';render()">‹ Volver</button></div><h1>${esc(exSel)}</h1><div class="mut" style="margin:-8px 0 12px">${esc(mus(exSel))}</div>${thumb(exSel,1)}<div class="row" style="margin:8px 0 12px"><input id="ph" type="file" accept="image/*" hidden onchange="setPhoto(this.files[0])"><input id="pc" type="file" accept="image/*" capture="environment" hidden onchange="setPhoto(this.files[0])"><button class="s" style="flex:1" onclick="document.getElementById('pc').click()">Hacer foto</button><button class="s" style="flex:1" onclick="document.getElementById('ph').click()">Galería</button>${S.img[exSel]?'<button class="d" onclick="delPhoto()">Quitar</button>':''}</div>${S.custom.some(c=>c.n===exSel)?'<button class="d w" onclick="delCustom()">Borrar este ejercicio</button>':''}`;
 if(!pts.length)return h+'<div class="card mut">Aún no has registrado este ejercicio.</div>';
 h+=`<div class="cols"><div class="card"><div class="big">${prMax(exSel)} ${cd?'km':'kg'}</div><div class="mut">${cd?'Mayor distancia':'Récord de peso'}</div></div><div class="card"><div class="big">${cd?pts.length:rm+' kg'}</div><div class="mut">${cd?'Sesiones':'1RM estimado'}</div></div></div><div class="card">${chart(pts)}</div><div class="card"><h2>Historial</h2>`;
 return h+pts.slice().reverse().map(p=>`<div style="margin-top:10px"><div class="mut">${fd(p.date)}</div><div>${fmt(p.sets)}</div></div>`).join('')+'</div>'}

const mon=d=>{d=new Date(d);d.setHours(0,0,0,0);d.setDate(d.getDate()-((d.getDay()+6)%7));return d.getTime()};
function viewMe(){const all=S.logs,cnt={};all.forEach(l=>{const k=mon(l.date);cnt[k]=(cnt[k]||0)+1});
 const cur=new Date(mon(Date.now())),ws=[];for(let i=7;i>=0;i--){const d=new Date(cur);d.setDate(d.getDate()-7*i);ws.push({k:d.getTime(),n:cnt[d.getTime()]||0,l:d.getDate()+'/'+(d.getMonth()+1)})}
 const mx=Math.max(3,...ws.map(w=>w.n));
 const pk=t=>{const x=new Date(t);x.setDate(x.getDate()-7);return x.getTime()};let st=0,kk=cur.getTime();if(!cnt[kk])kk=pk(kk);while(cnt[kk]){st++;kk=pk(kk)}
 const bars=ws.map((w,i)=>{const h=w.n/mx*70,x=8+i*38;return `<rect x="${x}" y="${88-h}" width="26" height="${h}" rx="5" fill="var(--acc)"/><text x="${x+13}" y="${82-h}" font-size="12" text-anchor="middle" fill="var(--ink)">${w.n||''}</text><text x="${x+13}" y="106" font-size="10" text-anchor="middle" fill="var(--mut)">${w.l}</text>`}).join('');
 const tv=all.reduce((t,l)=>t+vol(l.entries.flatMap(e=>e.sets)),0),td=all.reduce((t,l)=>t+(l.dur||0),0);
 return `<h1>Perfil</h1><div class="cols"><div class="card"><div class="big">${all.length}</div><div class="mut">Entrenamientos</div></div><div class="card"><div class="big">${nf(Math.round(tv/1000))} t</div><div class="mut">Volumen total</div></div><div class="card"><div class="big">${hm(td)}</div><div class="mut">Tiempo entrenado</div></div><div class="card"><div class="big">${all.reduce((t,l)=>t+(l.pr||0),0)} 🏆</div><div class="mut">Récords</div></div></div>
 ${viewOv()}${viewLv()}${viewGuide()}<div class="card"><div class="row sp"><h2>Entrenos por semana</h2><b>🔥 ${st} sem.</b></div><svg class="ch" viewBox="0 0 312 112" role="img" aria-label="Entrenamientos por semana">${bars}</svg></div>
 ${viewCal()}${viewBw()}${viewHelp()}<div class="card"><h2>Ajustes</h2><div class="mut" style="margin:8px 0 4px">Descanso entre series</div><select onchange="S.rest=+this.value;save()">${[45,60,90,120,180,240].map(s=>`<option value="${s}"${s===S.rest?' selected':''}>${s>=60?(s/60)+' min':s+' s'}${s%60&&s>60?'':''}</option>`).join('')}</select><button class="s w" style="margin-top:10px" onclick="backup()">Copiar copia de seguridad</button><textarea id="rs" placeholder="Pega aquí una copia de seguridad para restaurarla" style="width:100%;min-height:70px;margin-top:10px;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px"></textarea><button class="s w" style="margin-top:8px" onclick="restore()">Restaurar copia</button></div>`}
const REF={'Peso muerto':2.5,'Prensa':4,'Hip thrust':2.5,'Press banca':1.5,'Sentadilla':2,'Press militar':1,'Remo con barra':1.25,'Curl con barra':.8};
const GREF={Pecho:1.5,Espalda:1.4,Pierna:2,Glúteo:2,Hombro:1,Bíceps:.8,Tríceps:.9,Abdominales:.9,Antebrazo:.6};
const FT=[.10,.17,.24,.32,.39,.46,.54,.61,.68,.76,.83,.90,.98,1.06,1.14,1.22,1.32,1.45];
const TIERS=['Bronce','Plata','Oro','Esmeralda','Diamante','Rubí'],COL=['#cd7f32','#8c96a8','#d99a00','#1faa59','#1fa0e8','#e0334a'];
const lname=i=>i<0?'Sin rango':TIERS[i/3|0]+' '+['I','II','III'][i%3];
function bodyMap3(L){const mix=(c,t,a)=>{const p=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16)),x=p(c),y=p(t);return '#'+x.map((v,i)=>Math.round(v+(y[i]-v)*a).toString(16).padStart(2,'0')).join('')};
 const F=m=>{const o=L&&L[m];return o&&o.i>=0?'fill:url(#gm'+(o.i/3|0)+')':'fill:var(--mut);fill-opacity:.28'};
 const P=d=>'<path d="'+d+'"/><path d="'+d+'" transform="translate(200 0) scale(-1 1)"/>',G=(m,s)=>'<g style="'+F(m)+';stroke:var(--card);stroke-width:.9;stroke-linejoin:round">'+s+'</g>';
 const defs='<defs>'+COL.map((c,k)=>'<linearGradient id="gm'+k+'" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="'+mix(c,'#ffffff',.32)+'"/><stop offset="1" stop-color="'+mix(c,'#000000',.28)+'"/></linearGradient>').join('')+'</defs>';
 const sil='<g style="fill:var(--line);stroke:var(--mut);stroke-opacity:.7;stroke-width:1.2;stroke-linejoin:round"><ellipse cx="100" cy="17" rx="11" ry="14"/><path d="M93 28V40H107V28Z"/>'+P('M100 38C86 40 72 43 64 49C60 56 60 66 62 78C64 92 70 104 73 116C75 126 75 132 78 140L100 140Z')+P('M64 49C54 50 46 58 45 70C44 84 44 96 43 108C41 124 38 140 36 154L35 162L45 164L48 156C51 140 53 124 55 110C56 96 58 86 60 76C62 66 63 58 64 49Z')+P('M78 136C73 158 72 180 76 200C78 214 78 232 77 256L90 256C92 244 94 232 95 222C96 210 97 200 98 190C99 172 100 156 100 142Z')+'<ellipse cx="40" cy="168" rx="5" ry="7"/><ellipse cx="160" cy="168" rx="5" ry="7"/><ellipse cx="83" cy="262" rx="9" ry="4"/><ellipse cx="117" cy="262" rx="9" ry="4"/></g>';
 const com=sil+G('Hombro',P('M64 49C54 50 47 58 46 70C46 77 51 80 57 77C61 70 63 58 64 49Z'))+G('Antebrazo',P('M44 108C42 120 40 134 38 150C42 153 47 152 49 149C51 136 53 122 55 110Z'));
 const abs=['M99 84H86Q84 84 84 87V94Q84 97 87 97H99Z','M99 99H86Q84 99 84 102V108Q84 111 87 111H99Z','M99 113H87Q84 113 84 116V122Q84 125 87 125H99Z','M99 127H88Q86 127 86 130V136Q86 139 89 139H99Z','M83 86C78 94 76 106 77 120L83 122Z'].map(P).join('');
 const front=com+G('Pecho',P('M99 51C90 50 79 51 69 55C63 63 64 75 72 80C82 84 94 82 99 78Z'))+G('Abdominales',abs)+G('Bíceps',P('M47 76C44 84 44 94 46 101C50 104 56 102 58 98C59 90 58 82 56 76Z'))+G('Pierna',P('M82 144C77 158 75 176 78 194C84 199 92 199 97 192C98 176 99 158 98 144Z')+P('M79 204C78 218 79 234 80 248L88 248C90 236 92 220 93 206Z'))+'<path d="M100 50V142" style="stroke:var(--card);stroke-width:1;fill:none"/>';
 const back=com+G('Espalda',P('M100 40C90 42 78 45 66 52C70 61 83 71 100 79Z')+P('M99 82C84 78 71 69 65 60C63 76 67 94 76 108C84 114 94 114 99 112Z')+P('M99 115C92 115 84 114 78 112C79 121 81 129 84 136L99 136Z'))+G('Tríceps',P('M47 72C44 84 44 96 45 104C50 107 57 106 59 100C60 90 59 80 57 72Z'))+G('Glúteo',P('M99 138C88 136 78 140 76 150C76 160 84 166 99 162Z'))+G('Pierna',P('M79 168C77 181 78 193 80 205C87 209 94 209 98 203C99 191 99 177 98 165Z')+P('M79 212C74 224 78 239 81 250L88 250C93 239 95 224 90 212Z'))+'<path d="M100 40V138" style="stroke:var(--card);stroke-width:1;fill:none"/>';
 return '<svg class="ch" viewBox="0 0 420 270" role="img" aria-label="Mapa de rangos por músculo">'+defs+'<g>'+front+'</g><g transform="translate(220,0)">'+back+'</g></svg>'}
function viewOv(){const L=lvls();if(!L)return'';const ms=Object.keys(GREF),vs=ms.map(m=>L[m]?L[m].i:-1),n=vs.filter(v=>v>=0).length,i=Math.round(vs.reduce((a,b)=>a+b,0)/ms.length),c=i<0?'#7b8494':COL[i/3|0];
 const hex=`<svg viewBox="0 0 64 64" width="72" height="72" aria-hidden="true"><polygon points="32,3 57,17.5 57,46.5 32,61 7,46.5 7,17.5" style="fill:${c};stroke:#fff;stroke-opacity:.6;stroke-width:3"/><text x="32" y="41" text-anchor="middle" font-size="20" font-weight="700" style="fill:#fff">${i<0?'–':['I','II','III'][i%3]}</text></svg>`;
 return `<div class="card" style="border-color:${c}"><div class="row sp"><div><div class="mut" style="font-weight:600;letter-spacing:.06em">RANGO GENERAL</div><div class="big" style="font-size:36px;color:${c};text-transform:uppercase">${lname(i)}</div><div class="mut">${n} de ${ms.length} músculos con rango</div></div>${hex}</div><div style="margin-top:12px">${bodyMap3(L)}</div><div class="chips">${TIERS.map((t,k)=>`<span class="chip" style="color:${COL[k]}">● ${t}</span>`).join('')}</div></div>`}
function ref(n){const m=mus(n);if(/ayuda/i.test(n))return 0;let r=REF[n]||GREF[m];if(!r)return 0;if(!REF[n]){if(/mancuerna|martillo|concentrado|Goblet|búlgara|Zancadas|Step-up|Arnold/i.test(n))r*=.4;else if(/Aperturas|Elevaciones|Pájaros|Face pull|Patada|Abduc|Donkey|Clamshell/i.test(n))r*=.25}return r*(S.sex==='m'?.65:1)}
function lvls(){const bw=+S.bw;if(!bw)return null;const o={};
 S.logs.forEach(l=>l.entries.forEach(e=>{const r=ref(e.name);if(!r)return;const m=mus(e.name);e.sets.forEach(s=>{if(s.w||!s.kg||!s.reps)return;const x=s.kg*(1+Math.min(s.reps,12)/30),sc=x/bw/r;if(!o[m]||sc>o[m].s)o[m]={s:sc,n:e.name,x:Math.round(x)}})}));
 for(const m in o){let i=-1;FT.forEach((f,k)=>{if(o[m].s>=f)i=k});o[m].i=i;o[m].p=i>16?1:i<0?o[m].s/FT[0]:(o[m].s-FT[i])/(FT[i+1]-FT[i])}
 return o}
let gOpen=false,gm='Pecho',gx='';
const REFX={Pecho:'Press banca',Espalda:'Remo con barra',Pierna:'Sentadilla',Glúteo:'Hip thrust',Hombro:'Press militar',Bíceps:'Curl con barra',Tríceps:'Press cerrado',Abdominales:'Crunch en polea',Antebrazo:'Curl de muñeca'};
function viewGuide(){
 let h=`<div class="card"><div class="row sp"><h2>Guía de rangos</h2><button class="g" onclick="gOpen=!gOpen;render()">${gOpen?'Ocultar':'Ver todos'}</button></div>`;
 if(!gOpen)return h+'<div class="mut">Consulta qué necesitas levantar para llegar a cada rango.</div></div>';
 const ex=gx||REFX[gm],r=ref(ex),bw=+S.bw;let bx=0;
 S.logs.forEach(l=>l.entries.forEach(e=>{if(e.name===ex)e.sets.forEach(s=>{if(!s.w&&s.kg&&s.reps){const x=s.kg*(1+Math.min(s.reps,12)/30);if(x>bx)bx=x}})}));
 let cur=-1;if(bw&&r){const sc=bx/bw/r;FT.forEach((f,i)=>{if(sc>=f)cur=i})}
 h+=`<div class="mut" style="margin:6px 0 10px">Hay 6 rangos (Bronce, Plata, Oro, Esmeralda, Diamante y Rubí) con 3 niveles cada uno, de I a III. Tu rango en cada músculo depende de tu mejor 1RM estimado (el máximo que podrías levantar una vez) comparado con tu peso corporal. Tu rango general es la media de todos los músculos.</div><select aria-label="Músculo" onchange="gm=this.value;gx='';render()">${Object.keys(GREF).map(m=>`<option${m===gm?' selected':''}>${m}</option>`).join('')}</select><select aria-label="Ejercicio" onchange="gx=this.value;render()" style="margin-top:8px">${allEx().filter(e=>e.m===gm).map(e=>`<option${e.n===ex?' selected':''}>${esc(e.n)}</option>`).join('')}</select><div class="mut" style="margin:8px 0">${bw?'':'Escribe tu peso corporal para ver los kg. '}${bx?'Tu mejor 1RM estimado aquí: <b>'+Math.round(bx)+' kg</b>':'Aún no has registrado este ejercicio.'}</div>`;
 if(!r)return h+'<div class="mut">Este ejercicio no cuenta para los rangos.</div></div>';
 FT.forEach((f,i)=>{const x=f*r,k=x*bw,w8=k/(1+8/30);
  h+=`<div class="row sp" style="padding:7px 0;border-top:1px solid var(--line)${i===cur?';font-weight:700':''}"><span style="color:${COL[i/3|0]}">● ${lname(i)}${i===cur?' ◀ tú':''}</span><span class="mut" style="text-align:right">${bw?Math.round(k)+' kg (1RM) · '+Math.round(w8)+' kg × 8':x.toFixed(2).replace('.',',')+'× tu peso'}</span></div>`});
 return h+'<div class="mut" style="margin-top:10px">Por debajo de Bronce I aparece «Sin rango». Los ejercicios con mancuernas o de aislamiento exigen menos kg. Son referencias aproximadas.</div></div>'}
function viewLv(){const L=lvls();
 let h=`<div class="card"><h2>Niveles por músculo</h2><div class="row" style="margin:10px 0"><input inputmode="decimal" aria-label="Peso corporal en kg" placeholder="Tu peso (kg)" value="${S.bw||''}" oninput="S.bw=parseFloat(this.value.replace(',','.'))||0;save()" onchange="render()"><select aria-label="Sexo" onchange="S.sex=this.value;save();render()"><option value="h"${S.sex==='m'?'':' selected'}>Hombre</option><option value="m"${S.sex==='m'?' selected':''}>Mujer</option></select></div>`;
 if(!L)return h+'<div class="mut">Escribe tu peso corporal para calcular tus niveles.</div></div>';
 Object.keys(GREF).forEach(m=>{const o=L[m],i=o?o.i:-1,c=i<0?'#7b8494':COL[i/3|0],p=Math.round(Math.min(1,o?o.p:0)*100);
  h+=`<div class="row" style="margin-top:12px"><span class="th ph" style="background:${c}"><svg viewBox="0 0 64 64" aria-hidden="true">${fig(m)}</svg></span><div style="flex:1"><div class="row sp"><b>${m}</b><b style="color:${c}">${lname(i)}</b></div><div class="bar"><i style="width:${p}%;background:${c}"></i></div><div class="mut">${o?esc(o.n)+' · 1RM est. '+o.x+' kg':'Aún sin datos'}</div></div></div>`});
 return h+'<div class="mut" style="margin-top:14px">Se calcula con tu mejor 1RM estimado de cada músculo frente a tu peso corporal. Son referencias aproximadas.</div></div>'}
function restore(){try{const o=JSON.parse(document.getElementById('rs').value);if(!o||!Array.isArray(o.logs))throw 0;S=Object.assign({routines:[],logs:[],draft:null,custom:[],rest:90,img:{},bw:0,sex:'h'},o);S.draft=null;save();toast('Copia restaurada');render()}catch(e){toast('La copia no es válida')}}
function backup(){const t=JSON.stringify(S);try{navigator.clipboard.writeText(t).then(()=>toast('Copia en el portapapeles'),()=>toast('No se pudo copiar'))}catch(e){toast('No se pudo copiar')}}
function adj(ms){if(!ms)rest.end=0;else if(rest.end)rest.end+=ms;tick()}
function tick(){const du=due();if(wasDue!==null&&du!==wasDue){wasDue=du;render();return}wasDue=du;if(du)notifyNow();const d=S.draft,t=document.getElementById('tm');if(t&&d&&!d.tpl)t.textContent=dur(elapsed(d));
 const rb=document.getElementById('rb'),l=rest.end-Date.now();
 if(rest.end&&l<=0){rest.end=0;toast('Descanso terminado');try{navigator.vibrate&&navigator.vibrate(300)}catch(e){}}
 if(rest.end){rb.style.display='flex';document.getElementById('rt').textContent=dur(l)}else rb.style.display='none'}
function render(){const a=document.getElementById('app'),v={hist:viewHist,train:viewTrain,ex:viewEx,me:viewMe,sup:viewSup}[tab]();
 a.innerHTML=(S.draft&&tab!=='train'?'<button class="w" style="margin-bottom:12px" onclick="go(\'train\')">Entrenamiento en curso · Continuar</button>':'')+(tab!=='sup'?supBanner():'')+v;
 document.querySelectorAll('nav button').forEach(b=>b.setAttribute('aria-current',b.dataset.t===tab));document.querySelector('nav button[data-t=sup]').classList.toggle('dot',due());tick();wake()}
let wl=null,wlFail=false;
async function wake(){try{const need=S.draft&&!S.draft.tpl;if(need&&!wl&&!wlFail&&'wakeLock' in navigator){wl=await navigator.wakeLock.request('screen');wl.addEventListener('release',()=>{wl=null})}else if(!need&&wl){await wl.release();wl=null}}catch(e){wl=null;wlFail=true}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){wlFail=false;wake()}});
setInterval(tick,1000);render();splash();
</script>
