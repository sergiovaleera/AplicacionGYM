<!DOCTYPE html>
<html lang="es">
<head>

<style>
:root{--bg:#f3f4f7;--card:#fff;--ink:#12151c;--mut:#6b7280;--line:#e2e5ea;--acc:#1e6bff;--ai:#fff;--ok:#dff5ea;--bad:#e5484d;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d0f14;--card:#171a21;--ink:#f2f4f8;--mut:#8b93a3;--line:#272b35;--acc:#4c8dff;--ai:#0b1020;--ok:#16382c}}
:root[data-theme="dark"]{--bg:#0d0f14;--card:#171a21;--ink:#f2f4f8;--mut:#8b93a3;--line:#272b35;--acc:#4c8dff;--ai:#0b1020;--ok:#16382c}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 Barlow,system-ui,-apple-system,Segoe UI,sans-serif;padding-bottom:150px;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
main{max-width:520px;margin:0 auto;padding:12px 14px 0}
h1{font-size:30px;margin:6px 0 12px;font-weight:700}
h2{font-size:18px;margin:0;font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:12px}
.row{display:flex;gap:8px;align-items:center}.sp{justify-content:space-between}
.mut{color:var(--mut);font-size:14px}
button{font:inherit;font-weight:600;border:0;border-radius:10px;padding:11px 14px;background:var(--acc);color:var(--ai);min-height:44px}
button.g{background:transparent;color:var(--acc);padding:8px 10px;min-height:40px}
button.d{background:transparent;color:var(--bad);padding:8px 10px;min-height:40px}
button.s{background:var(--bg);color:var(--ink)}
button.w{width:100%}
input,select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;width:100%;min-height:44px}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:flex;gap:10px;padding:8px 0}
.top .ti{font-weight:700;font-size:18px}
.stats{display:flex;justify-content:space-around;margin-bottom:12px;text-align:center}
.stats b{display:block;font-size:20px}.stats span{font-size:13px;color:var(--mut)}
.hd,.set{display:grid;grid-template-columns:36px 1fr 1fr 1fr 42px;gap:6px;align-items:center}
.hd{margin-top:10px;font-size:12px;color:var(--mut);text-align:center;font-weight:600}
.set{margin:0 -6px;padding:4px 6px;border-radius:10px}.set.dn{background:var(--ok)}
.set input{text-align:center;font-size:18px;font-weight:600;padding:6px;min-height:40px;background:transparent}
.set.dn input{border-color:transparent}
.sn{background:var(--bg);color:var(--mut);padding:0;min-height:36px;border-radius:8px}
.sn.wm{color:#d98a00}.sn.am{color:#9b6bff}
.pv{background:transparent;color:var(--mut);padding:0;min-height:36px;font-weight:400;font-size:14px}
.ck{background:var(--bg);color:var(--mut);padding:0;min-height:40px}
.dn .ck{background:var(--acc);color:var(--ai)}
.big{font-size:26px;font-weight:700;line-height:1.1}
.chip{display:inline-block;background:var(--bg);border-radius:99px;padding:2px 10px;font-size:13px;margin:6px 6px 0 0;color:var(--mut)}
.grp{font-size:14px;color:var(--mut);font-weight:600;margin:14px 0 4px}
.ex{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:var(--card);color:var(--ink);border:1px solid var(--line);margin-bottom:6px;font-weight:600}
.th{width:44px;height:44px;border-radius:10px;object-fit:cover;flex:none;display:block}.ph{display:flex;align-items:center;justify-content:center;padding:5px}.ph svg{width:100%;height:100%}.ph.lg{padding:14px}.th.lg{width:100%;height:auto;aspect-ratio:16/10;border-radius:14px;font-size:56px}
.bar{height:6px;background:var(--bg);border-radius:9px;margin:5px 0;overflow:hidden}.bar i{display:block;height:100%;border-radius:9px}
.fl{display:flex;flex-wrap:wrap;gap:6px;padding:10px 0}.fc{flex:none;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:99px;padding:6px 14px;min-height:36px;font-size:14px}.fc.on{background:var(--acc);color:var(--ai);border-color:var(--acc)}
#fab{display:none;position:fixed;right:14px;bottom:calc(128px + env(safe-area-inset-bottom,0px));z-index:27;border-radius:99px;box-shadow:0 4px 14px rgba(0,0,0,.35);padding:10px 16px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
#pk{display:none;position:fixed;inset:0;z-index:40;background:var(--bg);overflow:auto;padding-top:env(safe-area-inset-top,0px)}
#pk .bar{display:flex;justify-content:space-between;align-items:center;padding:10px 16px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:25}
nav button{flex:1;background:transparent;color:var(--mut);border-radius:0;min-height:56px;font-size:14px;padding:6px}
nav button[aria-current="true"]{color:var(--acc);box-shadow:inset 0 3px 0 var(--acc)}
#rb{display:none;position:fixed;left:12px;right:12px;bottom:calc(66px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);border-radius:14px;padding:6px 8px 6px 14px;align-items:center;gap:4px;z-index:26;max-width:496px;margin:0 auto}
#rb span{flex:1;font-weight:600}#rb button{min-height:38px}#rb button.g{color:var(--bg)}
#toast{position:fixed;left:50%;top:calc(16px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:99px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s;z-index:50;max-width:90vw;text-align:center}
#toast.on{opacity:1}
svg.ch{width:100%;height:auto;display:block}
.md{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:60;display:flex;align-items:center;justify-content:center;padding:20px}.mb{background:var(--card);border-radius:16px;padding:18px;width:100%;max-width:340px}.mb p{margin:0 0 14px;font-weight:600;font-size:17px}.dg{background:var(--bad);color:#fff}
@media(prefers-reduced-motion:reduce){#toast{transition:none}}
</style>
</head>
<body>
<main id="app"></main>

<input id="pcam" type="file" accept="image/*" capture="environment" hidden onchange="setPhoto(this.files[0]);this.value=''">
<button id="fab" onclick="openChat()" aria-label="Abrir el asistente">✨ Asistente</button>

<div id="rb"><span>Descanso <b id="rt"></b></span><button class="g" onclick="adj(-15000)">−15</button><button class="g" onclick="adj(15000)">+15</button><button onclick="adj(0)">Saltar</button></div>

<button data-t="hist" onclick="go('hist')">Historial</button>

<script>
const K='hierro-v1';
let S={routines:[],logs:[],draft:null,custom:[],rest:90,img:{},bw:0,sex:'h'};
try{const r=localStorage.getItem(K);if(r)Object.assign(S,JSON.parse(r))}catch(e){}
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){try{toast('No se pudo guardar: memoria llena')}catch(x){}}};
const LIB={Pecho:['Press banca','Press banca inclinado','Aperturas con mancuernas','Fondos en paralelas','Cruce de poleas','Press banca con mancuernas','Press inclinado con mancuernas','Press declinado','Press en máquina','Pec deck','Flexiones','Aperturas en polea baja','Fondos con ayuda','Press banca en Smith','Press inclinado en Smith','Press declinado en Smith','Aperturas inclinadas con mancuernas','Pullover con mancuerna','Press en suelo con mancuernas','Cruce de poleas alto','Cruce de poleas bajo','Press de pecho convergente','Flexiones inclinadas','Flexiones declinadas','Fondos lastrados'],Espalda:['Dominadas','Remo con barra','Jalón al pecho','Remo en polea baja','Peso muerto','Remo con mancuerna','Remo en máquina','Remo en T','Dominadas supinas','Jalón agarre cerrado','Pullover en polea','Hiperextensiones','Encogimientos de hombros','Dominadas con ayuda','Remo bajo en máquina','Remo en Smith','Encogimientos en Smith','Jalón agarre supino','Jalón a una mano','Remo Pendlay','Remo unilateral en polea','Remo con apoyo en el pecho','Dominadas lastradas','Dominadas agarre neutro','Rack pull','Peso muerto con barra hexagonal','Buenos días','Remo invertido','Extensión de espalda en máquina'],Pierna:['Sentadilla','Prensa','Peso muerto rumano','Zancadas','Curl femoral','Extensión de cuádriceps','Elevación de gemelos','Sentadilla frontal','Sentadilla búlgara','Sentadilla hack','Sentadilla pendular','Goblet squat','Peso muerto sumo','Step-up','Aductores','Elevación de gemelos sentado','Sentadilla en Smith','Sentadilla frontal en Smith','Peso muerto rumano en Smith','Elevación de gemelos en Smith','Prensa horizontal','Prensa unilateral','Curl femoral sentado','Curl femoral de pie','Extensión de cuádriceps unilateral','Zancadas caminando','Zancadas hacia atrás','Sentadilla sumo','Sentadilla en caja','Sissy squat','Peso muerto con piernas rígidas','Elevación de gemelos en prensa'],Glúteo:['Hip thrust','Hip thrust en Smith','Puente de glúteo','Patada de glúteo en polea','Patada de glúteo en máquina','Abductores','Abducción en polea','Hip thrust unilateral','Abducción de cadera con banda','Donkey kick','Clamshell','Hiperextensión de glúteo'],Hombro:['Press militar','Elevaciones laterales','Pájaros','Face pull','Press con mancuernas sentado','Press Arnold','Press en máquina de hombro','Elevaciones frontales','Elevaciones laterales en polea','Remo al mentón','Press militar en Smith','Press militar tras nuca en Smith','Pájaros en máquina','Pájaros en polea','Elevaciones laterales en máquina','Elevaciones posteriores inclinado','Elevaciones frontales con disco','Press militar con mancuernas de pie','Push press','Press landmine'],Bíceps:['Curl con barra','Curl martillo','Curl en banco inclinado','Curl con mancuernas','Curl con barra Z','Curl predicador','Curl en polea','Curl concentrado','Curl martillo con cuerda','Curl spider','Curl Zottman','Curl alterno con mancuernas','Curl predicador en máquina','Curl en polea alta','Curl 21'],Tríceps:['Press francés','Extensión en polea','Fondos en banco','Press cerrado','Extensión con cuerda','Extensión sobre la cabeza','Patada de tríceps','Fondos en máquina','Press cerrado en Smith','Press francés con mancuernas','Extensión con barra recta en polea','Extensión a una mano en polea','Extensión tras nuca con mancuerna','Press cerrado con mancuernas','Flexiones diamante','Press JM','Fondos en paralelas para tríceps'],Abdominales:['Plancha','Crunch en polea','Elevación de piernas','Crunch abdominal','Rueda abdominal','Plancha lateral','Russian twist','Elevación de rodillas colgado','Leñador en polea','Crunch en máquina','Crunch inverso','Abdominales declinados','Bicicleta abdominal','Tijeras abdominales','Mountain climbers','Dead bug','Hollow hold','Elevación de piernas en banco','Plancha con toque de hombro','Pallof press','Inclinación lateral con mancuerna','Giro ruso con disco','Abdominales con peso','Abdominales en máquina con discos','Elevación de piernas en paralelas','Rotación de tronco en máquina','Giros en polea','Crunch en polea de rodillas','Plancha con peso','Toques de talón','Windshield wipers','Abdominales en banco romano'],Antebrazo:['Curl de muñeca','Curl de muñeca inverso','Paseo del granjero','Curl de muñeca con mancuerna','Curl inverso con barra','Colgarse de la barra','Rodillo de muñeca','Agarre con discos'],Cardio:['Cinta de correr','Bicicleta estática','Elíptica','Remo ergométrico','Comba','Escaleras','Natación','Caminata','Caminata inclinada','Carrera al aire libre','Ciclismo','Assault bike','Ski erg','Battle ropes','Senderismo']};
const allEx=()=>{const a=[];for(const m in LIB)LIB[m].forEach(n=>a.push({n,m}));S.custom.forEach(c=>a.push(c));return a};
const mus=n=>(allEx().find(e=>e.n.toLowerCase()===n.toLowerCase())||{m:'Otros'}).m;
const HL={Pecho:'<rect x="24" y="19" width="16" height="9" rx="3"/>',Espalda:'<rect x="22" y="20" width="6" height="16" rx="3"/><rect x="36" y="20" width="6" height="16" rx="3"/>',Pierna:'<rect x="23" y="41" width="8" height="19" rx="3"/><rect x="33" y="41" width="8" height="19" rx="3"/>',Glúteo:'<rect x="22" y="36" width="20" height="9" rx="4"/>',Hombro:'<circle cx="19" cy="21" r="5.5"/><circle cx="45" cy="21" r="5.5"/>',Bíceps:'<rect x="14" y="24" width="6" height="9" rx="3"/><rect x="44" y="24" width="6" height="9" rx="3"/>',Tríceps:'<rect x="14" y="22" width="3" height="12" rx="1.5"/><rect x="47" y="22" width="3" height="12" rx="1.5"/>',Abdominales:'<rect x="26" y="29" width="12" height="11" rx="3"/>',Antebrazo:'<rect x="14" y="34" width="6" height="10" rx="3"/><rect x="44" y="34" width="6" height="10" rx="3"/>'};
const fig=m=>m==='Cardio'?'<path d="M32 54C8 38 8 17 21 14c6-1 11 3 11 9 0-6 5-10 11-9 13 3 13 24-11 40z" fill="#fff"/>':m in HL?'<g fill="#fff" fill-opacity=".38"><circle cx="32" cy="10" r="5.5"/><rect x="22" y="17" width="20" height="23" rx="6"/><rect x="14" y="19" width="6" height="25" rx="3"/><rect x="44" y="19" width="6" height="25" rx="3"/><rect x="23" y="41" width="8" height="19" rx="3"/><rect x="33" y="41" width="8" height="19" rx="3"/></g><g fill="#fff">'+HL[m]+'</g>':'<g fill="#fff"><rect x="8" y="27" width="6" height="10" rx="2"/><rect x="15" y="22" width="7" height="20" rx="2"/><rect x="22" y="30" width="20" height="4"/><rect x="42" y="22" width="7" height="20" rx="2"/><rect x="50" y="27" width="6" height="10" rx="2"/></g>';
const thumb=(n,lg)=>{const i=S.img&&S.img[n],c=lg?' lg':'';if(i)return '<img class="th'+c+'" src="'+i+'" alt="'+esc(n)+'">';const m=mus(n);return '<span class="th ph'+c+'" style="background:hsl('+(m.charCodeAt(0)*37%360)+' 55% 42%)"><svg viewBox="0 0 64 64" aria-hidden="true">'+fig(m)+'</svg></span>'};
let photoFor='';function snap(n){photoFor=n;document.getElementById('pcam').click()}
function setPhoto(f){if(!f)return;const pn=photoFor||exSel;photoFor='';const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas'),k=Math.min(1,360/Math.max(im.width,im.height));c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);S.img=S.img||{};S.img[pn]=c.toDataURL('image/jpeg',.75);save();render();toast('Foto guardada')};im.onerror=()=>toast('No se pudo leer la imagen');im.src=r.result};r.readAsDataURL(f)}
function delPhoto(){delete S.img[exSel];save();render()}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const fd=d=>new Date(d).toLocaleDateString('es-ES',{weekday:'short',day:'numeric',month:'short'});
const p2=n=>String(n).padStart(2,'0');
const dur=ms=>{const s=Math.max(0,Math.round(ms/1000)),h=Math.floor(s/3600),m=Math.floor(s%3600/60);return(h?h+':'+p2(m):m)+':'+p2(s%60)};
const hm=ms=>{const m=Math.round(ms/60000);return m>=60?Math.floor(m/60)+' h '+p2(m%60)+' min':m+' min'};
const vol=a=>Math.round(a.reduce((t,s)=>t+(s.w||s.c?0:s.kg*s.reps),0));
const fmt=s=>s.map(x=>x.c?x.kg+' km · '+x.reps+' min':x.kg+'×'+x.reps).join('  ');
const nf=n=>n.toLocaleString('es-ES');
let tab='train',exSel='',pkq='',rest={end:0};
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),2000)}
function go(t){tab=t;render()}
function lastSets(n){for(let i=S.logs.length-1;i>=0;i--){const e=S.logs[i].entries.find(x=>x.name.toLowerCase()===n.toLowerCase());if(e){const w=e.sets.filter(s=>!s.w);if(w.length)return w}}return null}
function prMax(n){let m=0;S.logs.forEach(l=>l.entries.forEach(e=>{if(e.name===n)e.sets.forEach(s=>{if(!s.w&&s.kg>m)m=s.kg})}));return m}
function lastNote(n){for(let i=S.logs.length-1;i>=0;i--){const e=S.logs[i].entries.find(x=>x.name.toLowerCase()===n.toLowerCase());if(e)return e.note||''}return''}
const mk=n=>({name:n,note:lastNote(n),sets:(lastSets(n)||[0]).map(p=>({kg:p?p.kg:'',reps:p?p.reps:'',done:false,c:mus(n)==='Cardio'?1:0}))});

function ask(msg,label,fn){const o=document.createElement('div');o.className='md';o.innerHTML='<div class="mb" role="alertdialog"><p></p><div class="row"><button class="s" style="flex:1">Cancelar</button><button class="dg" style="flex:1"></button></div></div>';o.querySelector('p').textContent=msg;const b=o.querySelectorAll('button');b[1].textContent=label;b[0].onclick=()=>o.remove();b[1].onclick=()=>{o.remove();fn()};document.body.appendChild(o)}
/* Rutinas y entreno */
function start(rid){const r=S.routines.find(x=>x.id===rid);S.draft={name:r?r.name:'Entrenamiento',start:Date.now(),tpl:'',entries:(r?r.ex:[]).map(mk)};save();render()}
function dlg(t,v,ro,label,fn,msg){const o=document.createElement('div');o.className='md';o.innerHTML='<div class="mb" role="dialog"><h2></h2><div class="mut" style="margin:6px 0 8px"></div><textarea style="width:100%;min-height:110px;font:inherit;font-size:13px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px"></textarea><div class="row" style="margin-top:12px"><button class="s" style="flex:1">Cerrar</button><button style="flex:1"></button></div></div>';
 o.querySelector('h2').textContent=t;o.querySelector('.mut').textContent=msg;const ta=o.querySelector('textarea');ta.value=v;ta.readOnly=ro;const b=o.querySelectorAll('button');b[1].textContent=label;b[0].onclick=()=>o.remove();b[1].onclick=()=>fn(ta,o);document.body.appendChild(o);if(ro){ta.focus();ta.select()}}
function encR(r){const c=r.ex.map(n=>S.custom.find(x=>x.n===n)).filter(Boolean);return 'HIERRO:'+btoa(unescape(encodeURIComponent(JSON.stringify({n:r.name,e:r.ex,c}))))}
function shareR(id){const r=S.routines.find(x=>x.id===id),txt='Mi rutina "'+r.name+'" para la app Hierro. Pega este texto en Entrenar → Importar:\n'+encR(r);
 const show=()=>dlg('Compartir rutina',txt,true,'Copiar',ta=>{ta.select();try{navigator.clipboard.writeText(txt).then(()=>toast('Copiado'),()=>{document.execCommand('copy');toast('Copiado')})}catch(e){try{document.execCommand('copy');toast('Copiado')}catch(x){}}},'Copia este texto y envíaselo a tu amigo.');
 if(navigator.share){navigator.share({text:txt}).catch(e=>{if(!e||e.name!=='AbortError')show()})}else show()}
function importR(){dlg('Importar rutina','',false,'Importar',(ta,o)=>{const m=ta.value.match(/HIERRO:([A-Za-z0-9+/=]+)/);if(!m){toast('No encuentro una rutina en ese texto');return}
 try{const d=JSON.parse(decodeURIComponent(escape(atob(m[1]))));if(!d||!Array.isArray(d.e)||!d.e.length)throw 0;
 (d.c||[]).forEach(c=>{if(c&&c.n&&!allEx().some(e=>e.n.toLowerCase()===String(c.n).toLowerCase()))S.custom.push({n:String(c.n),m:Object.keys(LIB).includes(c.m)?c.m:'Otros'})});
 S.routines.push({id:uid(),name:String(d.n||'Rutina').slice(0,60),ex:d.e.map(String).slice(0,60)});save();o.remove();toast('Rutina importada');render()}catch(e){toast('El texto de la rutina no es válido')}},'Pega aquí el texto que te ha enviado tu amigo.')}
const GUIDE=`Guía de la app Hierro:
- Entrenar: empiezas un entrenamiento vacío o con una rutina, creas rutinas (+ Nueva rutina), importas o compartes rutinas con un texto y puedes crear un plan automático de rutinas.
- Durante el entreno: cada ejercicio tiene series con las columnas Anterior (lo que hiciste la última vez; al tocarlo se copia), Kg y Reps, y un ✓ que completa la serie y arranca el temporizador de descanso. Al tocar el número de la serie cambia su tipo: W = calentamiento, A = aproximación; ninguna cuenta para volumen, récords ni rangos. Hay una nota por ejercicio, flechas ▲▼ para ordenar y, al tocar la miniatura del ejercicio, se hace una foto de la máquina. "Terminar" guarda el entreno en el Historial. La pantalla se mantiene encendida durante el entreno si el móvil lo permite.
- Historial: entrenos con duración, volumen y récords; se pueden repetir, añadirles una foto o borrarlos.
- Ejercicios: biblioteca de unos 200 ejercicios con filtro por grupo muscular; se crean ejercicios propios con + Crear; cada ejercicio muestra récord, 1RM estimado, gráfica, historial y permite añadir foto.
- Perfil: estadísticas, rango general con mapa del cuerpo, niveles por músculo, Guía de rangos, entrenos por semana y racha, ajustes (descanso, copia de seguridad y restaurar).
- Rangos: Bronce, Plata, Oro, Esmeralda, Diamante y Rubí, cada uno con niveles I, II y III. Se calculan por músculo con el mejor 1RM estimado (Epley, hasta 12 reps) dividido por el peso corporal y comparado con una referencia por ejercicio. Hay que escribir el peso corporal en Perfil. Las series W/A, los ejercicios con ayuda y el cardio no cuentan. El rango general es la media de los músculos. Los umbrales son aproximados.
- Cardio: se apunta con km y minutos y no cuenta para volumen ni rangos.
- Extras: calculadora de discos (botón durante el entreno), editar un entreno guardado desde el Historial con Editar, registro de peso corporal con gráfica y calendario del mes en el Perfil, y borrar ejercicios propios desde su ficha.
- Datos: se guardan solo en el navegador del móvil; no hay cuenta ni sincronización. Conviene usar siempre el mismo navegador y hacer copias de seguridad desde Perfil.`;

 let cur=-1;if(bw&&r){const sc=bx/bw/r;FT.forEach((f,i)=>{if(sc>=f)cur=i})}
 h+=`<div class="mut" style="margin:6px 0 10px">Hay 6 rangos (Bronce, Plata, Oro, Esmeralda, Diamante y Rubí) con 3 niveles cada uno, de I a III. Tu rango en cada músculo depende de tu mejor 1RM estimado (el máximo que podrías levantar una vez) comparado con tu peso corporal. Tu rango general es la media de todos los músculos.</div><select aria-label="Músculo" onchange="gm=this.value;gx='';render()">${Object.keys(GREF).map(m=>`<option${m===gm?' selected':''}>${m}</option>`).join('')}</select><select aria-label="Ejercicio" onchange="gx=this.value;render()" style="margin-top:8px">${allEx().filter(e=>e.m===gm).map(e=>`<option${e.n===ex?' selected':''}>${esc(e.n)}</option>`).join('')}</select><div class="mut" style="margin:8px 0">${bw?'':'Escribe tu peso corporal para ver los kg. '}${bx?'Tu mejor 1RM estimado aquí: <b>'+Math.round(bx)+' kg</b>':'Aún no has registrado este ejercicio.'}</div>`;
 if(!r)return h+'<div class="mut">Este ejercicio no cuenta para los rangos.</div></div>';
 FT.forEach((f,i)=>{const x=f*r,k=x*bw,w8=k/(1+8/30);
  h+=`<div class="row sp" style="padding:7px 0;border-top:1px solid var(--line)${i===cur?';font-weight:700':''}"><span style="color:${COL[i/3|0]}">● ${lname(i)}${i===cur?' ◀ tú':''}</span><span class="mut" style="text-align:right">${bw?Math.round(k)+' kg (1RM) · '+Math.round(w8)+' kg × 8':x.toFixed(2).replace('.',',')+'× tu peso'}</span></div>`});
 return h+'<div class="mut" style="margin-top:10px">Por debajo de Bronce I aparece «Sin rango». Los ejercicios con mancuernas o de aislamiento exigen menos kg. Son referencias aproximadas.</div></div>'}
function viewLv(){const L=lvls();
 let h=`<div class="card"><h2>Niveles por músculo</h2><div class="row" style="margin:10px 0"><input inputmode="decimal" aria-label="Peso corporal en kg" placeholder="Tu peso (kg)" value="${S.bw||''}" oninput="S.bw=parseFloat(this.value.replace(',','.'))||0;save()" onchange="render()"><select aria-label="Sexo" onchange="S.sex=this.value;save();render()"><option value="h"${S.sex==='m'?'':' selected'}>Hombre</option><option value="m"${S.sex==='m'?' selected':''}>Mujer</option></select></div>`;
 if(!L)return h+'<div class="mut">Escribe tu peso corporal para calcular tus niveles.</div></div>';
 Object.keys(GREF).forEach(m=>{const o=L[m],i=o?o.i:-1,c=i<0?'#7b8494':COL[i/3|0],p=Math.round(Math.min(1,o?o.p:0)*100);
  h+=`<div class="row" style="margin-top:12px"><span class="th ph" style="background:${c}"><svg viewBox="0 0 64 64" aria-hidden="true">${fig(m)}</svg></span><div style="flex:1"><div class="row sp"><b>${m}</b><b style="color:${c}">${lname(i)}</b></div><div class="bar"><i style="width:${p}%;background:${c}"></i></div><div class="mut">${o?esc(o.n)+' · 1RM est. '+o.x+' kg':'Aún sin datos'}</div></div></div>`});
 return h+'<div class="mut" style="margin-top:14px">Se calcula con tu mejor 1RM estimado de cada músculo frente a tu peso corporal. Son referencias aproximadas.</div></div>'}
function restore(){try{const o=JSON.parse(document.getElementById('rs').value);if(!o||!Array.isArray(o.logs))throw 0;S=Object.assign({routines:[],logs:[],draft:null,custom:[],rest:90,img:{},bw:0,sex:'h'},o);S.draft=null;save();toast('Copia restaurada');render()}catch(e){toast('La copia no es válida')}}
function backup(){const t=JSON.stringify(S);try{navigator.clipboard.writeText(t).then(()=>toast('Copia en el portapapeles'),()=>toast('No se pudo copiar'))}catch(e){toast('No se pudo copiar')}}
function adj(ms){if(!ms)rest.end=0;else if(rest.end)rest.end+=ms;tick()}
function tick(){const d=S.draft,t=document.getElementById('tm');if(t&&d&&!d.tpl)t.textContent=dur(Date.now()-d.start);
 const rb=document.getElementById('rb'),l=rest.end-Date.now();
 if(rest.end&&l<=0){rest.end=0;toast('Descanso terminado');try{navigator.vibrate&&navigator.vibrate(300)}catch(e){}}
 if(rest.end){rb.style.display='flex';document.getElementById('rt').textContent=dur(l)}else rb.style.display='none'}
function render(){const a=document.getElementById('app'),v={hist:viewHist,train:viewTrain,ex:viewEx,me:viewMe}[tab]();
 a.innerHTML=(S.draft&&tab!=='train'?'<button class="w" style="margin-bottom:12px" onclick="go(\'train\')">Entrenamiento en curso · Continuar</button>':'')+v;
 document.querySelectorAll('nav button').forEach(b=>b.setAttribute('aria-current',b.dataset.t===tab));tick();wake()}
let wl=null,wlFail=false;
async function wake(){try{const need=S.draft&&!S.draft.tpl;if(need&&!wl&&!wlFail&&'wakeLock' in navigator){wl=await navigator.wakeLock.request('screen');wl.addEventListener('release',()=>{wl=null})}else if(!need&&wl){await wl.release();wl=null}}catch(e){wl=null;wlFail=true}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){wlFail=false;wake()}});
setInterval(tick,1000);render();initAI();
</script>
<script>if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(function(){})</script>
